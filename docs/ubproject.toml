# CodeLinks source tracing for the Tool Runtime package, and the test-report
# conversion, for the same manual.
#
# Read by sphinx-codelinks and sphinx-test-reports from next to conf.py
# (docs/conf.py). The file is the shared ubCode project file; only the
# sections below are this repository's configuration. Relative paths are
# resolved against this file's directory, so the source root is the package
# directory one level up.
"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

[codelinks]
# The remote URL is the trace the documentation cites: it names the commit
# the build was made from, never a moving branch.
set_remote_url = true

[codelinks.projects.tool_runtime]
remote_url_pattern = "https://github.com/dymzz/vesryn-tool-runtime/blob/{commit}/{path}#L{line}"
# The field the references are attached to. It is a list of URLs, one per
# reference, in source order.
ref_url_field = "code_url"

[codelinks.projects.tool_runtime.source_discover]
# Only the package's own source is scanned.
src_dir = "../src/vesryn_tool_runtime"
include = ["**/*.py"]
comment_type = "python"
gitignore = true

[codelinks.projects.tool_runtime.analyse]
# Existing Needs are referenced, never created from the source.
get_need_id_refs = true
get_oneline_needs = false
get_multiline_needs = false

[codelinks.projects.tool_runtime.analyse.need_id_refs]
markers = ["@need-ids:"]

# The test-report conversion. The `build needs` command of ub-test-reports
# reads this table; the build imports what the command wrote, so the property
# mapping is declared once and nowhere else. A `--link-property` flag would
# replace the whole table, so the command line must not carry one.
[test_reports.build.needs]
# The JUnit property a test declares, mapped to the link field the need
# carries. The property name is the one the pytest plugin writes.
link_properties = { Verifies = "verifies" }
# The need type of a test case; it must agree with the build's `case` type.
need_type = "testcase"
project = "vesryn-tool-runtime"
version = "0.3.1"
# The source address of a test case. The commit is given per invocation.
remote_url = "https://github.com/dymzz/vesryn-tool-runtime"
url_pattern = "{base}/blob/{commit}/{file}#L{line}"
