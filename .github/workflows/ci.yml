name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    uses: dymzz/engineering-ci/.github/workflows/reusable-python-ci.yml@0f74b2f776796b9db83f7a61c0849e504afdbea0 # v0.6.7 fixed commit
    with:
      pytest_report_function: test-results
      pytest_check: vesryn-tool-runtime-ci:tests
    secrets:
      ENGINEERING_CI_READ_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.14'
      - name: Verify the independent installed wheel
        env:
          GH_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          uv lock --check
          uv build
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/tool-runtime.txt"
          uv venv --python 3.14 "$RUNNER_TEMP/tool-runtime-wheel"
          uv pip install --python "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -r "$RUNNER_TEMP/tool-runtime.txt" dist/vesryn_tool_runtime-0.3.1-py3-none-any.whl
          unset GH_TOKEN
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I examples/direct_tool.py
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I -c 'import importlib.util as u; assert u.find_spec("vesryn") is None and u.find_spec("engineering_ci") is None'
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I - <<'PY'
          # The frozen schema and seed ship as package resources and the
          # store entry works from the installed wheel alone (issue #27).
          from vesryn_tool_runtime.discovery_records import (
              Platform, ToolAsset, ToolAssetVersion,
          )
          from vesryn_tool_runtime.record_schema import SCHEMA_VERSION, seed_sql
          from vesryn_tool_runtime.record_store import open_record_store

          assert "vulture" in seed_sql()
          store = open_record_store(":memory:")
          store.assets.put(
              ToolAsset(
                  "probe", "probe", "uv",
                  (ToolAssetVersion(
                      "1", "https://example.invalid/p.whl", "sha256", "0" * 64,
                      Platform("linux", "x86_64", "gnu"), ">=3.10",
                  ),),
                  "probe",
              )
          )
          release = store.assets.get("probe").versions[0]
          assert (release.platform.abi, release.python) == ("gnu", ">=3.10")
          store.close()
          assert SCHEMA_VERSION == 2
          PY
      - name: Verify the live record declaration offline
        run: |
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I examples/shared_definitions.py
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I - <<'PY'
          # The bundled live declaration loads from package resources and
          # the public registration/composition chain works from the
          # installed wheel alone -- no placeholder capabilities, no
          # source checkout.
          import json
          import os
          from importlib.metadata import version
          from pathlib import Path

          from vesryn_tool_runtime import (
              RecordError, ToolAsset, bundled_records, compose_catalog,
              legacy_preparation_definitions, open_record_store,
          )

          assert version("vesryn-tool-runtime") == "0.3.1"
          records = bundled_records()
          assets = [r for r in records if isinstance(r, ToolAsset)]
          identities = [r.tool_id for r in assets]
          assert len(identities) == len(set(identities))
          required = {
              "trivy", "vulture", "hyperfine", "ripgrep", "osv-scanner",
              "actionlint", "shellcheck", "zizmor", "semgrep", "lychee",
              "pyright", "deptry", "pylint", "import-linter", "hypothesis",
              "mutmut", "schemathesis",
          }
          assert required <= set(identities)
          catalog = compose_catalog(records)
          assert len(catalog.accesses_for("trivy")) == 3
          assert catalog.accesses_for("deptry") == ()
          try:
              catalog.accesses_for("absent")
              raise SystemExit("missing tool must not resolve")
          except RecordError as error:
              assert error.code == "unknown_tool"
          store = open_record_store(":memory:")
          store.put_records(records)
          assert store.assets.get("vulture").versions[1].python == ">=3.8"
          store.close()
          assert len(legacy_preparation_definitions()) == len(assets)
          evidence = {
              "version": version("vesryn-tool-runtime"),
              "tools": sorted(identities),
              "groups": sorted(g.group_id for g in catalog.groups()),
              "accesses": sorted(a.access_id for a in catalog.accesses()),
              "placeholders": "none",
              "execution": "not_performed",
          }
          Path(os.environ["RUNNER_TEMP"], "live-declaration.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Live declaration verified offline: {len(identities)} tools")
          PY
      - name: Prepare independent acceptance toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes aria2=1.37.0+debian-1build3
          uv pip install --python "$RUNNER_TEMP/tool-runtime-wheel/bin/python" dagger-io==1.0.0b16
          apt-cache show aria2=1.37.0+debian-1build3 > "$RUNNER_TEMP/aria2-package.txt"
      - name: Prepare Dagger CLI
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v1.0.0-beta.16
      - name: Verify real assets and public Dagger delivery
        run: |
          dagger --progress plain run "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I examples/asset_acceptance.py \
            --root "$RUNNER_TEMP/asset-acceptance" \
            --aria2 "$(command -v aria2c)" --aria2-version 1.37.0 \
            --aria2-sha256 "$(sha256sum "$(command -v aria2c)" | cut -d ' ' -f 1)" \
            --allow-network --with-dagger
      - name: Retain asset acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vesryn-tool-runtime-asset-acceptance
          path: |
            ${{ runner.temp }}/asset-acceptance/acceptance.json
            ${{ runner.temp }}/aria2-package.txt
            ${{ runner.temp }}/shared-asset-acceptance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain versioned Python artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vesryn-tool-runtime-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
