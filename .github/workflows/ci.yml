name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    uses: dymzz/engineering-ci/.github/workflows/reusable-python-ci.yml@0f74b2f776796b9db83f7a61c0849e504afdbea0 # v0.6.7 fixed commit
    with:
      pytest_report_function: test-results
      pytest_check: vesryn-tool-runtime-ci:tests
    secrets:
      ENGINEERING_CI_READ_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.14'
      - name: Verify the independent installed wheel
        env:
          GH_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          uv lock --check
          uv build
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/tool-runtime.txt"
          uv venv --python 3.14 "$RUNNER_TEMP/tool-runtime-wheel"
          uv pip install --python "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -r "$RUNNER_TEMP/tool-runtime.txt" dist/vesryn_tool_runtime-0.3.0-py3-none-any.whl
          unset GH_TOKEN
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I examples/direct_tool.py
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I -c 'import importlib.util as u; assert u.find_spec("vesryn") is None and u.find_spec("engineering_ci") is None'
      - name: Verify combined shared definitions offline
        run: |
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I examples/shared_definitions.py
          "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I - <<'PY'
          import json
          import os
          from importlib.metadata import version
          from pathlib import Path

          from vesryn_tool_runtime import (
              Catalog, ToolAsset, ToolGroup, load_shared_definitions,
              register_shared_definitions, shared_definition_documents,
          )

          assert version("vesryn-tool-runtime") == "0.3.0"
          names = shared_definition_documents()
          records = tuple(r for name in names for r in load_shared_definitions(name))
          required = {
              "vulture", "pyright", "deptry", "pylint", "osv-scanner",
              "actionlint", "shellcheck", "zizmor", "semgrep", "lychee", "trivy",
          }
          identities = [r.definition.asset_id for r in records]
          assert required <= set(identities)
          assert len(identities) == len(set(identities)), "Duplicate shared asset identity"
          # Unified registration (#32): every tool registers directly by its
          # primary key in a catalog with no ToolSpec and no adapter -- the
          # empty-spec placeholder pattern is gone. This proves records and
          # package data only; nothing is executed.
          catalog = Catalog()
          register_shared_definitions(catalog, records)
          keys = [t for r in records for t in r.tools]
          assert len(keys) == len(set(keys)), "Duplicate tool primary key"
          for record in records:
              for tool_id in record.tools:
                  assert catalog.asset_for(tool_id) is record.definition
          catalog.register_group(ToolGroup("ci.shared-tools", tuple(sorted(set(keys)))))
          assert catalog.group_for("ci.shared-tools").members == tuple(sorted(set(keys)))
          evidence = {
              "version": version("vesryn-tool-runtime"),
              "documents": names,
              "definitions": {r.definition.asset_id: r.definition.sha256 for r in records},
              "required_assets": sorted(required),
              "tool_primary_keys": sorted(set(keys)),
              "registration_only": "passed",
              "execution": "not_performed",
          }
          Path(os.environ["RUNNER_TEMP"], "shared-asset-acceptance.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Offline installed-wheel registration passed: {len(records)} assets")
          PY
      - name: Prepare independent acceptance toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes aria2=1.37.0+debian-1build3
          uv pip install --python "$RUNNER_TEMP/tool-runtime-wheel/bin/python" dagger-io==1.0.0b16
          apt-cache show aria2=1.37.0+debian-1build3 > "$RUNNER_TEMP/aria2-package.txt"
      - name: Prepare Dagger CLI
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v1.0.0-beta.16
      - name: Verify real assets and public Dagger delivery
        run: |
          dagger --progress plain run "$RUNNER_TEMP/tool-runtime-wheel/bin/python" -I examples/asset_acceptance.py \
            --root "$RUNNER_TEMP/asset-acceptance" \
            --aria2 "$(command -v aria2c)" --aria2-version 1.37.0 \
            --aria2-sha256 "$(sha256sum "$(command -v aria2c)" | cut -d ' ' -f 1)" \
            --allow-network --with-dagger
      - name: Retain asset acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vesryn-tool-runtime-asset-acceptance
          path: |
            ${{ runner.temp }}/asset-acceptance/acceptance.json
            ${{ runner.temp }}/aria2-package.txt
            ${{ runner.temp }}/shared-asset-acceptance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain versioned Python artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vesryn-tool-runtime-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
